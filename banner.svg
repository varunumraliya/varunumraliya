<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 56px;
      letter-spacing: 4px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 2.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .tag-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 13px;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    .pulse {
      animation: pulseGlow 4s infinite ease-in-out;
    }
  </style>

  <!-- Base Canvas & Frame -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#cyberGrid)" rx="16"/>

  <!-- Top Ambient Lights -->
  <circle cx="200" cy="40" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glowCyan)"/>
  <circle cx="1000" cy="50" r="160" fill="#a855f7" opacity="0.12" filter="url(#glowPurple)"/>

  <!-- Border Gradient Stroke -->
  <rect x="1.5" y="1.5" width="1197" height="317" rx="15" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Top Status Badge -->
  <g transform="translate(425, 38)">
    <rect x="0" y="0" width="350" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19" fill="#94a3b8" class="badge-text">FORWARD DEPLOYED &amp; AGENTIC AI</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 135)" text-anchor="middle">
    <text class="title" fill="url(#textGrad)">VARUN UMRALIYA</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 180)" text-anchor="middle">
    <text class="subtitle" fill="url(#neonCyan)">FULL STACK &amp; AGENTIC AI DEVELOPER</text>
  </g>

  <!-- Tagline Summary -->
  <g transform="translate(600, 215)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14px" fill="#8b949e">
      Building Autonomous AI Agents • High-Performance SaaS Platforms • Real-Time Systems • AWS Cloud
    </text>
  </g>

  <!-- Bottom Tech Pills / Chips -->
  <g transform="translate(170, 252)">
    <!-- Pill 1: AI Agents -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="195" height="32" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="21" fill="#38bdf8" class="tag-text">⚡ AI Digital Workers</text>
    </g>

    <!-- Pill 2: Next.js & React -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="205" height="32" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="21" fill="#818cf8" class="tag-text">🚀 React &amp; Next.js 15</text>
    </g>

    <!-- Pill 3: Node & Laravel -->
    <g transform="translate(430, 0)">
      <rect x="0" y="0" width="210" height="32" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="21" fill="#34d399" class="tag-text">⚙️ Node.js &amp; Laravel</text>
    </g>

    <!-- Pill 4: AWS & Redis -->
    <g transform="translate(655, 0)">
      <rect x="0" y="0" width="205" height="32" rx="8" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="21" fill="#f472b6" class="tag-text">☁️ AWS &amp; Redis Cache</text>
    </g>
  </g>

  <!-- Subtle Bottom Neon Line -->
  <path d="M 300 316 L 900 316" stroke="url(#neonPurple)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
